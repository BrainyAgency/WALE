<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer un admin INVER</title>
<style>
  body{font-family:sans-serif;max-width:420px;margin:40px auto;padding:0 16px}
  input,button{width:100%;padding:11px;margin:6px 0;font-size:16px;box-sizing:border-box}
  button{background:#10b981;border:0;border-radius:8px;font-weight:700;cursor:pointer}
  #out{white-space:pre-wrap;margin-top:12px}
</style>
</head>
<body>
<h2>Créer le compte administrateur</h2>
<input id="name"  placeholder="Nom complet">
<input id="phone" placeholder="Téléphone ex : +22890000000" inputmode="tel">
<input id="pass"  type="password" placeholder="Mot de passe (6 caractères min)">
<button id="go">Créer l'administrateur</button>
<div id="out"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAe3VwRV4nCCUdLCVjkJaWHG__udFcKx-I",
  authDomain: "invers-7ea73.firebaseapp.com",
  projectId: "invers-7ea73",
  storageBucket: "invers-7ea73.firebasestorage.app",
  messagingSenderId: "597668783108",
  appId: "1:597668783108:web:abf68dca0b535e7de10151",
  measurementId: "G-XLEHDQ41P9"
});
const auth = getAuth(app);
const db = getFirestore(app);
const out = document.getElementById("out");

document.getElementById("go").onclick = async () => {
  const fullName = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.replace(/[\s\-().]/g, "");
  const password = document.getElementById("pass").value;
  if (fullName.length < 2 || !/^\+?[0-9]{8,15}$/.test(phone) || password.length < 6) {
    out.textContent = "Vérifiez le nom, le téléphone et le mot de passe (6 caractères min).";
    return;
  }
  try {
    // même règle que user.html et admin.html : u_<chiffres du téléphone>@inver.tg
    const email = `u_${phone.replace(/[^0-9]/g, "")}@inver.tg`;
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    const uid = cred.user.uid;
    const rnd = crypto.getRandomValues(new Uint8Array(6));
    const code = "INV" + Array.from(rnd, b => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b % 32]).join("");
    await setDoc(doc(db, "users", uid), {
      uid, fullName, phone,
      role: "admin",
      status: "active",
      level: 0,
      balance: 0,
      reservedBalance: 0,
      totalEarnings: 0,
      totalCommissions: 0,
      totalWithdrawals: 0,
      inviteCode: code,
      referredBy: null,
      referralsCount: 0,
      activeReferralsCount: 0,
      createdAt: serverTimestamp()
    });
    out.textContent = "✅ Administrateur créé.\nCode d'invitation : " + code + "\nConnectez-vous dans admin.html avec ce téléphone et ce mot de passe.\nSupprimez ensuite ce fichier.";
  } catch (e) {
    out.textContent = "Erreur : " + (e.code || "") + " " + e.message;
  }
};
</script>
</body>
</html>
